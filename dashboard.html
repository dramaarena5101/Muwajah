<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard - Muwajah</title>

    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-color: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--primary-bg);
            /* Soft gradient background */
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 0.03) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.03) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.03) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .stat-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .icon-box.green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .icon-box.orange {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .recent-table th {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
        }

        .recent-table td {
            vertical-align: middle;
            font-size: 0.95rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .badge-jenis {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent-color);
        }

        .switch-custom .form-check-input:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        /* Floating Navbar */
        .navbar-floating {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 100px;
            margin: 20px auto;
            max-width: 1200px;
            padding: 10px 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <!-- Floating Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-floating animate-fade">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="ph-fill ph-chart-line-up text-primary"></i>
                Muwajah Executive
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="form-check form-switch switch-custom d-flex align-items-center gap-2 m-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="autoRefreshToggle">
                    <label class="form-check-label text-muted fw-bold" for="autoRefreshToggle"
                        style="font-size: 0.9rem;">Auto-Refresh</label>
                </div>
                <div class="spinner-grow spinner-grow-sm text-primary" id="loadingIndicator" style="display: none;"
                    role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 1200px;">

        <!-- Hero Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-4 animate-fade delay-1">
                <div class="glass-card p-4 d-flex align-items-center justify-content-between h-100">
                    <div>
                        <div class="stat-card-title mb-1">Total Setoran</div>
                        <div class="stat-card-value" id="valTotalLaporan">--</div>
                    </div>
                    <div class="icon-box">
                        <i class="ph-bold ph-files"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4 animate-fade delay-2">
                <div class="glass-card p-4 d-flex align-items-center justify-content-between h-100">
                    <div>
                        <div class="stat-card-title mb-1">Kelas Berpartisipasi</div>
                        <div class="stat-card-value" id="valTotalKelas">--</div>
                    </div>
                    <div class="icon-box green">
                        <i class="ph-bold ph-users-three"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4 animate-fade delay-3">
                <div class="glass-card p-4 d-flex align-items-center justify-content-between h-100">
                    <div>
                        <div class="stat-card-title mb-1">Materi Tersampaikan</div>
                        <div class="stat-card-value" id="valTotalPelajaran">--</div>
                    </div>
                    <div class="icon-box orange">
                        <i class="ph-bold ph-book-open-text"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-4 mb-4">
            <div class="col-md-8 animate-fade delay-2">
                <div class="glass-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0 d-flex align-items-center gap-2">
                            <i class="ph-duotone ph-chart-bar text-primary"></i>
                            Distribusi Setoran per Kelas
                        </h5>
                        <button class="btn btn-sm btn-light border text-muted fw-bold rounded-pill px-3"
                            onclick="downloadChart('barChart', 'Distribusi_Kelas.png')">
                            <i class="ph-bold ph-download-simple me-1"></i> Simpan
                        </button>
                    </div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4 animate-fade delay-3">
                <div class="glass-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold m-0 d-flex align-items-center gap-2">
                            <i class="ph-duotone ph-chart-pie-slice text-success"></i>
                            Komposisi Pelajaran
                        </h5>
                    </div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Feed -->
        <div class="row g-4">
            <div class="col-12 animate-fade delay-3">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                        <i class="ph-duotone ph-activity text-danger pulse"></i>
                        Aktivitas Setoran Terkini (Live Feed)
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-borderless recent-table mb-0">
                            <thead>
                                <tr>
                                    <th>Waktu</th>
                                    <th>Santri</th>
                                    <th>Kelas</th>
                                    <th>Pelajaran & Materi</th>
                                    <th>Ustadz</th>
                                </tr>
                            </thead>
                            <tbody id="liveFeedBody">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                        Memuat data...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // ⚠️ COPY-PASTE CONFIG FIREBASE ANDA DI SINI
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCZFTSN6XQsw9SLOkv6KwiIiOXLWRSAKRA",
            authDomain: "muwajah-5101.firebaseapp.com",
            projectId: "muwajah-5101",
            storageBucket: "muwajah-5101.firebasestorage.app",
            messagingSenderId: "896718761940",
            appId: "1:896718761940:web:e8c9688433d37d4e907041"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            alert("Error Inisialisasi Firebase. Pastikan firebaseConfig sudah diisi!");
        }

        // Chart Instances
        let myBarChart = null;
        let myPieChart = null;

        // Auto-refresh interval variable
        let refreshInterval = null;

        // Animation function for counting numbers
        function animateValue(obj, start, end, duration) {
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Easing function for smoother stop
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                obj.innerHTML = Math.floor(easeOutQuart * (end - start) + start).toLocaleString("id-ID");
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        async function fetchDashboardData() {
            if (!db) return;
            document.getElementById('loadingIndicator').style.display = 'inline-block';

            try {
                // 1. FETCH GLOBAL STATS (Cost: 1 Read)
                const statRef = doc(db, "stats", "global");
                const docSnap = await getDoc(statRef);

                let stats = { total_laporan: 0, kelas: {}, pelajaran: {} };
                if (docSnap.exists()) {
                    const raw = docSnap.data();
                    stats.total_laporan = raw.total_laporan || 0;

                    Object.keys(raw).forEach(k => {
                        if (k.startsWith("kelas_")) stats.kelas[k.replace("kelas_", "")] = raw[k];
                        else if (k.startsWith("pelajaran_")) stats.pelajaran[k.replace("pelajaran_", "")] = raw[k];
                    });
                }

                // Render Hero Cards
                const elTotal = document.getElementById("valTotalLaporan");
                const currentTotal = parseInt(elTotal.innerText.replace(/\./g, '')) || 0;
                animateValue(elTotal, currentTotal, stats.total_laporan, 1500);

                const totalKelas = Object.keys(stats.kelas).length;
                const totalPelajaran = Object.keys(stats.pelajaran).length;
                document.getElementById("valTotalKelas").innerText = totalKelas;
                document.getElementById("valTotalPelajaran").innerText = totalPelajaran;

                // Render Charts
                renderBarChart(stats.kelas);
                renderPieChart(stats.pelajaran);

                // 2. FETCH LATEST ACTIVITY (Cost: 10 Reads)
                const qActivity = query(collection(db, "setoran"), orderBy("tanggal", "desc"), limit(10));
                const snapActivity = await getDocs(qActivity);

                let feedHtml = "";
                snapActivity.forEach(docSnap => {
                    const d = docSnap.data();

                    // Format time (HH:mm)
                    let timeStr = "";
                    try {
                        const dt = new Date(d.tanggal);
                        timeStr = dt.getHours().toString().padStart(2, '0') + ":" + dt.getMinutes().toString().padStart(2, '0');
                    } catch (e) { }

                    feedHtml += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="bg-light px-2 py-1 rounded text-muted" style="font-family:monospace; font-size:12px;">${timeStr}</div>
                                </div>
                            </td>
                            <td>
                                <div class="fw-bold text-dark" style="line-height:1.2">${d.nama}</div>
                                <small class="text-muted" style="font-size:0.75rem;">${d.stambuk}</small>
                            </td>
                            <td>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border">${d.kelas}</span>
                            </td>
                            <td>
                                <div class="fw-bold text-primary" style="font-size:0.9rem;">${d.pelajaran}</div>
                                <div class="d-flex align-items-center gap-2 mt-1">
                                    <span class="badge-jenis">${d.jenis}</span>
                                    <small class="text-muted text-truncate" style="max-width:200px;">${d.judul}</small>
                                </div>
                            </td>
                            <td class="text-muted">
                                <i class="ph-fill ph-user-circle me-1"></i>${d.ustadz}
                            </td>
                        </tr>
                    `;
                });

                if (feedHtml === "") feedHtml = `<tr><td colspan="5" class="text-center py-4 text-muted">Belum ada data setoran.</td></tr>`;
                document.getElementById("liveFeedBody").innerHTML = feedHtml;

            } catch (e) {
                console.error(e);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        // ==========================
        // CHART.JS RENDERERS
        // ==========================
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.color = "#64748b";

        function renderBarChart(dataObj) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (myBarChart) myBarChart.destroy();

            // Sort by values descending
            const sortedKeys = Object.keys(dataObj).sort((a, b) => dataObj[b] - dataObj[a]);
            // Limit to Top 15 to avoid clutter
            const topKeys = sortedKeys.slice(0, 15);
            const topValues = topKeys.map(k => dataObj[k]);

            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(79, 70, 229, 0.8)');
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.4)');

            myBarChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: topKeys,
                    datasets: [{
                        label: 'Jumlah Setoran',
                        data: topValues,
                        backgroundColor: gradient,
                        borderRadius: 8,
                        borderSkipped: false,
                        barThickness: 'flex',
                        maxBarThickness: 40
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.9)',
                            padding: 12,
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            cornerRadius: 8,
                            displayColors: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(0,0,0,0.03)', drawBorder: false },
                            ticks: { font: { weight: '500' } }
                        },
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { font: { weight: '600' } }
                        }
                    },
                    animation: {
                        y: { duration: 1000, easing: 'easeOutQuart' }
                    }
                }
            });
        }

        function renderPieChart(dataObj) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (myPieChart) myPieChart.destroy();

            const sortedKeys = Object.keys(dataObj).sort((a, b) => dataObj[b] - dataObj[a]);
            // Group others if more than 5
            let labels = [];
            let values = [];
            if (sortedKeys.length > 5) {
                labels = sortedKeys.slice(0, 5);
                values = labels.map(k => dataObj[k]);
                const otherSum = sortedKeys.slice(5).reduce((sum, key) => sum + dataObj[key], 0);
                labels.push("Lainnya");
                values.push(otherSum);
            } else {
                labels = sortedKeys;
                values = labels.map(k => dataObj[k]);
            }

            const colors = [
                '#4f46e5', // Indigo
                '#06b6d4', // Cyan
                '#10b981', // Emerald
                '#f59e0b', // Amber
                '#ec4899', // Pink
                '#94a3b8'  // Slate (Lainnya)
            ];

            myPieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                font: { weight: '500' }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.9)',
                            padding: 12,
                            cornerRadius: 8
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1200
                    }
                }
            });
        }

        // ==========================
        // AUTO REFRESH LOGIC
        // ==========================
        document.getElementById("autoRefreshToggle").addEventListener("change", function () {
            if (this.checked) {
                // Refresh every 30 seconds
                refreshInterval = setInterval(fetchDashboardData, 30000);
                // Add pulse animation to Live feed icon
                document.querySelector(".ph-activity").classList.add("text-danger");
                document.querySelector(".ph-activity").style.animation = "pulse 1.5s infinite";
            } else {
                clearInterval(refreshInterval);
                document.querySelector(".ph-activity").style.animation = "none";
            }
        });

        // Add pulse keyframe via JS so it applies only when toggled
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes pulse {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.2); opacity: 0.7; }
                100% { transform: scale(1); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Download Chart Feature
        window.downloadChart = function (canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;

            // To ensure white background on JPG/PNG instead of transparent
            const newCanvas = document.createElement('canvas');
            newCanvas.width = canvas.width;
            newCanvas.height = canvas.height;
            const newCtx = newCanvas.getContext('2d');
            newCtx.fillStyle = '#ffffff';
            newCtx.fillRect(0, 0, newCanvas.width, newCanvas.height);
            newCtx.drawImage(canvas, 0, 0);

            link.href = newCanvas.toDataURL('image/png');
            link.click();
        }

        // Initial Load
        // Tunggu sedikit agar animasi UI jalan duluan, baru fetch data
        setTimeout(fetchDashboardData, 400);

    </script>
</body>

</html>
